<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Likii...Birthdayy</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   BASIC RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    font-family:"DM Sans",sans-serif;

    color:#3f2931;

    overflow-x:hidden;

    position:relative;

    /*
       IMPORTANT:
       The background now scrolls with the page.

       100% auto means:
       - Full width of the screen
       - Height automatically maintains the photo ratio
       - No cropping
       - No fixed background
    */

    background:

        #5f4750

        url("20261005_233922.jpg")

        center top / 100% auto

        scroll

        no-repeat;

}


/* =========================================================
   DARK TRANSPARENT OVERLAY
========================================================= */

body::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:rgba(35,24,30,.43);

    backdrop-filter:blur(1.5px);

    -webkit-backdrop-filter:blur(1.5px);

    z-index:-1;

    pointer-events:none;

}


/* =========================================================
   SOFT WARM GLOW
========================================================= */

body::after{

    content:"";

    position:absolute;

    width:420px;

    height:420px;

    right:-160px;

    bottom:-170px;

    border-radius:50%;

    background:rgba(255,225,205,.28);

    filter:blur(45px);

    z-index:-1;

    pointer-events:none;

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

    width:min(1050px,92%);

    margin:auto;

}


/* =========================================================
   HERO / HEADER
========================================================= */

.hero{

    text-align:center;

    padding:58px 16px 28px;

}


.kicker{

    display:inline-block;

    font-size:.78rem;

    letter-spacing:3px;

    text-transform:uppercase;

    color:#fff7f3;

    font-weight:700;

    text-shadow:

        0 2px 10px rgba(0,0,0,.35);

}


h1{

    font-family:Caveat,cursive;

    font-size:

        clamp(3.2rem,10vw,6.2rem);

    line-height:.9;

    margin:10px 0;

    color:#fffaf7;

    text-shadow:

        0 4px 18px rgba(55,25,35,.45);

}


.subtitle{

    font-family:Caveat,cursive;

    font-size:1.55rem;

    color:#fff4ee;

    margin:15px auto;

    max-width:620px;

    text-shadow:

        0 2px 10px rgba(0,0,0,.4);

}


.validity{

    display:inline-block;

    margin-top:8px;

    padding:9px 18px;

    border:

        1px solid

        rgba(255,255,255,.7);

    border-radius:999px;

    background:

        rgba(255,248,244,.82);

    color:#744354;

    font-size:.85rem;

    font-weight:600;

    box-shadow:

        0 8px 25px

        rgba(40,20,25,.18);

}


/* =========================================================
   COUPON GRID
========================================================= */

.coupons{

    display:grid;

    grid-template-columns:

        repeat(2,1fr);

    gap:22px;

    padding:

        22px 0 55px;

}


/* =========================================================
   FREE FOREVER HEADING
========================================================= */

.forever-heading{

    grid-column:1 / -1;

    text-align:center;

    font-family:Caveat,cursive;

    font-size:2.5rem;

    font-weight:700;

    color:#fffaf7;

    text-shadow:

        0 3px 12px rgba(0,0,0,.45);

    padding:20px 0 5px;

}


/* =========================================================
   COUPON CARD
========================================================= */

.card{

    position:relative;

    background:

        rgba(255, 250, 247, 0.352);

    border:

        1px solid

        rgba(255,255,255,.85);

    border-radius:24px;

    padding:25px;

    box-shadow:

        0 15px 35px

        rgba(45,25,32,.20);

    backdrop-filter:blur(9px);

    -webkit-backdrop-filter:blur(9px);

    transition:.25s;

    overflow:hidden;

}


.card:hover{

    transform:translateY(-5px);

    background:

        rgba(255,252,250,.95);

    box-shadow:

        0 20px 42px

        rgba(45,25,32,.27);

}


/* Decorative circle */

.card::after{

    content:"";

    position:absolute;

    right:-25px;

    top:-25px;

    width:95px;

    height:95px;

    background:

        rgba(236,190,202,.28);

    border-radius:50%;

    pointer-events:none;

}


/* =========================================================
   ICON
========================================================= */

.icon{

    font-size:2rem;

    position:relative;

    z-index:1;

}


/* =========================================================
   CARD TITLE
========================================================= */

.card h2{

    font-family:Caveat,cursive;

    font-size:2rem;

    margin:

        8px 0 7px;

    color:#713f4d;

    position:relative;

    z-index:1;

}


/* =========================================================
   CARD DESCRIPTION
========================================================= */

.card p{

    margin:

        0 0 20px;

    line-height:1.55;

    color:#604c53;

    min-height:49px;

    position:relative;

    z-index:1;

}


/* =========================================================
   REDEEM BUTTON
========================================================= */

.redeem{

    border:0;

    background:#713f4d;

    color:#fff;

    padding:

        11px 18px;

    border-radius:999px;

    font-weight:700;

    cursor:pointer;

    font-family:inherit;

    position:relative;

    z-index:2;

    transition:.2s;

}


.redeem:hover{

    background:#542d3a;

    transform:scale(1.03);

}


.redeem:disabled{

    cursor:default;

    transform:none;

}


/* =========================================================
   REDEEMED CARD
========================================================= */

.card.redeemed{

    background:

        rgba(255,248,248,.78);

    opacity:.82;

}


.card.redeemed .redeem{

    background:#b88995;

}


.card.redeemed::before{

    content:"REDEEMED ♥";

    position:absolute;

    right:18px;

    top:17px;

    font-size:.68rem;

    letter-spacing:1px;

    font-weight:800;

    color:#a25e70;

    z-index:2;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    text-align:center;

    padding:

        5px 0 50px;

    color:#fff6f1;

    font-family:Caveat,cursive;

    font-size:1.35rem;

    text-shadow:

        0 2px 10px rgba(0,0,0,.45);

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    background:

        rgba(38,24,29,.62);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:10;

}


.modal.show{

    display:flex;

}


.modal-box{

    background:

        rgba(255,250,247,.97);

    border-radius:28px;

    padding:32px;

    text-align:center;

    max-width:440px;

    width:100%;

    box-shadow:

        0 25px 70px

        rgba(0,0,0,.3);

    animation:

        pop .25s ease;

}


@keyframes pop{

    from{

        transform:scale(.88);

        opacity:0;

    }

    to{

        transform:scale(1);

        opacity:1;

    }

}


.modal-box .big{

    font-size:3rem;

}


.modal-box h3{

    font-family:Caveat,cursive;

    font-size:2.3rem;

    margin:10px 0;

    color:#713f4d;

}


.modal-box p{

    line-height:1.6;

    color:#604c53;

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

.close{

    margin-top:10px;

    border:0;

    background:#ead9de;

    color:#713f4d;

    padding:

        10px 20px;

    border-radius:999px;

    cursor:pointer;

    font-weight:700;

}


.close:hover{

    background:#dcc3cb;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    body{

        /*
           Still scrolls with page on mobile
        */

        background-attachment:scroll;

        background-position:center top;

        background-size:100% auto;

    }


    .coupons{

        grid-template-columns:1fr;

    }


    .hero{

        padding-top:42px;

    }


    .card{

        padding:22px;

    }


    .forever-heading{

        font-size:2.2rem;

    }

}


</style>

</head>


<body>


<main class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<section class="hero">


    <div class="kicker">

        A little something...naninda

    </div>


    <h1>

        Ninge anta!!!

    </h1>


    <div class="subtitle">

        Ninge Yavaga beko aga choose madu likiii🫂

    </div>


    <div class="validity">

        ⏳ validity till - 30 Sept 2027

    </div>


</section>



<!-- =====================================================
     COUPONS
===================================================== -->

<section

    class="coupons"

    id="coupons">

</section>



<!-- =====================================================
     FOOTER
===================================================== -->

<div class="footer">

    Ista aytha??...Agilla andru adjust karoo!! — Abhii ♡

</div>


</main>



<!-- =====================================================
     POPUP MODAL
===================================================== -->

<div

    class="modal"

    id="modal">


    <div class="modal-box">


        <div

            class="big"

            id="modalIcon">

            💌

        </div>


        <h3

            id="modalTitle">

        </h3>


        <p

            id="modalText">

        </p>


        <p>

            <strong>

                Valid for 6 months.

            </strong>

            <br>

            Redeemed by Likkiii ❤️

        </p>


        <button

            class="close"

            onclick="closeModal()">

            Close

        </button>


    </div>

</div>



<script>


/* =========================================================
   COUPON DATA
========================================================= */

const coupons = [


    /* =====================================================
       ORIGINAL COUPONS
    ===================================================== */


    {

        icon:"",

        title:"Movie Coupon",

        text:

        "Likii..Olle movie select madu aytha!!"

    },


    {

        icon:"",

        title:"Random Adventure Coupon",

        text:

        "Nodu...Matte sigalla....Choose madu...hogana!!"

    },


    {

        icon:"",

        title:"Your Choice Coupon",

        text:

        "Nodappa helu...nin en helthiyo nan hage kelthini...full day"

    },


    {

        icon:"",

        title:"Music Concert Coupon",

        text:

        "Nijja...Ond chanag ero Concert ge hogana likki!!!"

    },


    {

        icon:"",

        title:"Wonderla Coupon",

        text:

        "Baa...Thrilling rides ge karkondu hogthini!!!"

    },


    {

        icon:"",

        title:"Pottery Together Coupon",

        text:

        "Baa..Ottige madike madana likkiii!!"

    },


    /* =====================================================
       FREE COUPONS FOR FOREVER
    ===================================================== */


    {

        icon:"",

        title:"Window Seat Coupon",

        text:

        "Obvisouly...Window seat yavgalu nindu...its official now..!!"

    },


    {

        icon:"",

        title:"Call Me Coupon",

        text:

        "Likki...Nodu ninge enu matadakke ella andru...call madu...!!"

    },


    {

        icon:"",

        title:"Overthinking Rescue Coupon",

        text:

        "Much needed ninge edu...I will be u r forver therapist!!!"

    },


    {

        icon:"",

        title:"Gossip Coupon",

        text:

        "Obvisouly...estu vishya eralla gossip madakke!!!"

    },


    {

        icon:"",

        title:"Long Walk Coupon",

        text:

        "Silent Walk likki...ninge yavaga mathad beku ansutte aga mathadu!!!...Peace!!!"

    },


    {

        icon:"",

        title:"Photos Capture Coupon",

        text:

        "Again Obvisouly...I will be u r forever cameraman"

    }

];



/* =========================================================
   CREATE COUPON CARDS
========================================================= */

const couponBox =

    document.getElementById("coupons");


coupons.forEach((c,i)=>{


    /*
       Insert the Forever heading
       before coupon number 7
    */

    if(i === 6){

        const heading =

            document.createElement("div");


        heading.className =

            "forever-heading";


        heading.textContent =

            "Forever Coupons♡";


        couponBox.appendChild(heading);

    }


    /* Create card */

    const card =

        document.createElement("article");


    card.className =

        "card";


    card.id =

        "coupon-" + i;


    card.innerHTML = `

        <div class="icon">

            ${c.icon}

        </div>


        <h2>

            ${c.title}

        </h2>


        <p>

            “${c.text}”

        </p>


        <button

            class="redeem"

            onclick="redeem(${i})">

            Redeem Coupon

        </button>

    `;


    couponBox.appendChild(card);

});



/* =========================================================
   REDEEM COUPON
========================================================= */

function redeem(i){


    /*
       Check if already redeemed
    */

    const redeemed =

        localStorage.getItem(

            "coupon-v3-" + i

        ) === "true";


    if(redeemed)

        return;


    /*
       Save redeemed state
    */

    localStorage.setItem(

        "coupon-v3-" + i,

        "true"

    );


    /*
       Get card
    */

    const card =

        document.getElementById(

            "coupon-" + i

        );


    /*
       Mark as redeemed
    */

    card.classList.add(

        "redeemed"

    );


    /*
       Change button
    */

    const button =

        card.querySelector(

            ".redeem"

        );


    button.textContent =

        "Redeemed ❤️";


    button.disabled = true;



    /*
       Put coupon information
       inside popup
    */

    document.getElementById(

        "modalIcon"

    ).textContent =

        coupons[i].icon;


    document.getElementById(

        "modalTitle"

    ).textContent =

        coupons[i].title;


    document.getElementById(

        "modalText"

    ).textContent =

        coupons[i].text;



    /*
       Show popup
    */

    document.getElementById(

        "modal"

    ).classList.add(

        "show"

    );

}



/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document.getElementById(

        "modal"

    ).classList.remove(

        "show"

    );

}



/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

window.addEventListener(

    "click",

    e => {


        if(

            e.target.id === "modal"

        ){

            closeModal();

        }

    }

);



/* =========================================================
   RESTORE REDEEMED COUPONS
========================================================= */

coupons.forEach((_,i)=>{


    if(

        localStorage.getItem(

            "coupon-v3-" + i

        ) === "true"

    ){


        const card =

            document.getElementById(

                "coupon-" + i

            );


        card.classList.add(

            "redeemed"

        );


        const btn =

            card.querySelector(

                ".redeem"

            );


        btn.textContent =

            "Redeemed ❤️";


        btn.disabled = true;

    }

});


</script>


</body>

</html>
