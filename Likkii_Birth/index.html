<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Likkii..Swalpa special agu🫂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   BASIC RESET
========================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  font-family:"DM Sans",sans-serif;

  color:#33272c;

  overflow-x:hidden;

  /*
    YOUR PHOTO AS BACKGROUND
    Keep the image in the same folder
    as index.html
  */

  background-image:url("20261005_213619.jpg");

  background-size:cover;
  background-position:center center;
  background-attachment:fixed;

  position:relative;
}


/* =========================
   BACKGROUND OVERLAY
========================= */

body::before{

  content:"";

  position:fixed;

  inset:0;

  /*
    White transparent layer makes
    the text easier to read
  */

  background:rgba(255,248,246,0.58);

  backdrop-filter:blur(2px);

  -webkit-backdrop-filter:blur(2px);

  z-index:-1;
}


/* Soft warm/pink tint */

body::after{

  content:"";

  position:fixed;

  inset:0;

  background:
    linear-gradient(
      135deg,
      rgba(255,226,235,0.20),
      rgba(255,247,224,0.12),
      rgba(221,231,255,0.16)
    );

  z-index:-1;

  pointer-events:none;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{

  width:min(1050px,92%);

  margin:auto;
}


/* =========================
   HERO SECTION
========================= */

.hero{

  text-align:center;

  padding:58px 16px 28px;
}


/* Small heading */

.kicker{

  display:inline-block;

  font-size:.78rem;

  letter-spacing:3px;

  text-transform:uppercase;

  color:#6d4656;

  font-weight:700;

  background:rgba(255,255,255,.72);

  padding:7px 14px;

  border-radius:999px;

  box-shadow:
    0 5px 20px rgba(70,45,55,.10);
}


/* Main title */

h1{

  font-family:Caveat,cursive;

  font-size:clamp(3.2rem,10vw,6.2rem);

  line-height:.9;

  margin:10px 0;

  color:#552c42;

  text-shadow:
    0 2px 12px rgba(255,255,255,.75);
}


/* Subtitle */

.subtitle{

  font-family:Caveat,cursive;

  font-size:1.55rem;

  color:#513e46;

  margin:15px auto;

  max-width:620px;

  text-shadow:
    0 1px 8px rgba(255,255,255,.9);
}


/* Validity badge */

.validity{

  display:inline-block;

  margin-top:8px;

  padding:9px 18px;

  border:1px solid rgba(116,75,91,.35);

  border-radius:999px;

  background:rgba(255,255,255,.76);

  color:#674051;

  font-size:.85rem;

  box-shadow:
    0 5px 18px rgba(70,45,55,.09);
}


/* =========================
   COUPONS GRID
========================= */

.coupons{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:22px;

  padding:22px 0 55px;
}


/* =========================
   COUPON CARD
========================= */

.card{

  position:relative;

  background:rgba(255,252,250,.86);

  border:1px solid rgba(255,255,255,.9);

  border-radius:24px;

  padding:25px;

  box-shadow:
    0 12px 30px rgba(65,43,50,.16),
    inset 0 1px 0 rgba(255,255,255,.8);

  backdrop-filter:blur(8px);

  -webkit-backdrop-filter:blur(8px);

  transition:.25s;

  overflow:hidden;
}


/* Hover effect */

.card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 18px 35px rgba(65,43,50,.22),
    inset 0 1px 0 rgba(255,255,255,.9);
}


/* Decorative circle */

.card::after{

  content:"";

  position:absolute;

  right:-25px;

  top:-25px;

  width:90px;

  height:90px;

  background:rgba(245,211,222,.55);

  border-radius:50%;
}


/* Coupon icon */

.icon{

  font-size:2rem;
}


/* Coupon title */

.card h2{

  font-family:Caveat,cursive;

  font-size:2rem;

  margin:8px 0 7px;

  color:#5a3045;
}


/* Coupon description */

.card p{

  margin:0 0 20px;

  line-height:1.55;

  color:#59484e;

  min-height:49px;
}


/* =========================
   REDEEM BUTTON
========================= */

.redeem{

  border:0;

  background:#65364e;

  color:#fff;

  padding:11px 18px;

  border-radius:999px;

  font-weight:700;

  cursor:pointer;

  font-family:inherit;

  box-shadow:
    0 5px 12px rgba(101,54,78,.22);
}


.redeem:hover{

  background:#4f293d;
}


/* =========================
   REDEEMED CARD
========================= */

.card.redeemed{

  background:rgba(255,248,250,.75);

  opacity:.8;
}


.card.redeemed .redeem{

  background:#ad8292;

  cursor:default;
}


/* Redeemed label */

.card.redeemed::before{

  content:"REDEEMED ♥";

  position:absolute;

  right:18px;

  top:17px;

  font-size:.68rem;

  letter-spacing:1px;

  font-weight:800;

  color:#9a5f74;

  z-index:2;
}


/* =========================
   FOOTER
========================= */

.footer{

  text-align:center;

  padding:5px 0 50px;

  color:#563d47;

  font-family:Caveat,cursive;

  font-size:1.35rem;

  text-shadow:
    0 1px 8px rgba(255,255,255,.9);
}


/* =========================
   MODAL
========================= */

.modal{

  position:fixed;

  inset:0;

  background:rgba(35,25,30,.55);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  z-index:10;

  backdrop-filter:blur(5px);

  -webkit-backdrop-filter:blur(5px);
}


.modal.show{

  display:flex;
}


/* Modal box */

.modal-box{

  background:rgba(255,250,247,.96);

  border-radius:28px;

  padding:32px;

  text-align:center;

  max-width:440px;

  width:100%;

  box-shadow:
    0 25px 70px rgba(0,0,0,.25);

  animation:pop .25s ease;

  border:1px solid rgba(255,255,255,.9);
}


/* Animation */

@keyframes pop{

  from{

    transform:scale(.88);

    opacity:0;
  }

  to{

    transform:scale(1);

    opacity:1;
  }
}


/* Modal icon */

.modal-box .big{

  font-size:3rem;
}


/* Modal title */

.modal-box h3{

  font-family:Caveat,cursive;

  font-size:2.3rem;

  margin:10px 0;

  color:#5a3045;
}


/* Modal text */

.modal-box p{

  line-height:1.6;

  color:#59484e;
}


/* Close button */

.close{

  margin-top:10px;

  border:0;

  background:#ead9df;

  color:#5a3045;

  padding:10px 20px;

  border-radius:999px;

  cursor:pointer;

  font-weight:700;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .coupons{

    grid-template-columns:1fr;
  }

  .hero{

    padding-top:42px;
  }

  .card{

    padding:22px;
  }

  body{

    background-attachment:scroll;

    background-position:center center;
  }
}

</style>
</head>


<body>


<main class="container">


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <div class="kicker">
      A little something from me
    </div>

    <h1>
      Ninge anta!!!
    </h1>

    <div class="subtitle">
      Ninge Yavaga beko aga choose madu likiii 🫂
    </div>

    <div class="validity">
      ⏳ Validity- 6 months
    </div>

  </section>


  <!-- =========================
       COUPONS
  ========================== -->

  <section
    class="coupons"
    id="coupons">
  </section>


  <!-- =========================
       FOOTER
  ========================== -->

  <div class="footer">

    Jasti ista pattu madidini Likkii— Abhii ♡

  </div>


</main>



<!-- =========================
     REDEEM MODAL
========================== -->

<div
  class="modal"
  id="modal">

  <div class="modal-box">

    <div
      class="big"
      id="modalIcon">
      💌
    </div>

    <h3 id="modalTitle"></h3>

    <p id="modalText"></p>

    <p>

      <strong>
        Valid for 6 months.
      </strong>

      <br>

      Redeemed by Likkiii ❤️

    </p>

    <button
      class="close"
      onclick="closeModal()">

      Close

    </button>

  </div>

</div>



<script>


/* =========================
   COUPON DATA
========================= */

const coupons = [

  {
    icon:"🎬",

    title:"Movie Coupon",

    text:
      "Redeem for 1 movie together — your choice!"
  },


  {
    icon:"🎵",

    title:"Music Concert Coupon",

    text:
      "Redeem for one music concert together!"
  },


  {
    icon:"🌆",

    title:"Random Adventure Coupon",

    text:
      "You choose the place. I’ll come with you."
  },


  {
    icon:"🎢",

    title:"Wonderla Coupon",

    text:
      "Redeem for one fun-filled Wonderla day together!"
  },


  {
    icon:"👑",

    title:"Your Choice Coupon",

    text:
      "For one day, you get to decide what we do. I cannot complain."
  },


  {
    icon:"🏺",

    title:"Pottery Class Together Coupon",

    text:
      "Redeem for one pottery class together — let's make something memorable!"
  }

];



/* =========================
   CREATE COUPONS
========================= */

const couponBox =
  document.getElementById("coupons");


coupons.forEach((c,i)=>{


  const card =
    document.createElement("article");


  card.className="card";


  card.id="coupon-"+i;


  card.innerHTML=`

    <div class="icon">
      ${c.icon}
    </div>

    <h2>
      ${c.title}
    </h2>

    <p>
      “${c.text}”
    </p>

    <button
      class="redeem"
      onclick="redeem(${i})">

      Redeem Coupon

    </button>

  `;


  couponBox.appendChild(card);

});



/* =========================
   REDEEM FUNCTION
========================= */

function redeem(i){


  const redeemed =
    localStorage.getItem(
      "coupon-"+i
    ) === "true";


  /* Already redeemed */

  if(redeemed){

    return;

  }


  /* Save redemption */

  localStorage.setItem(
    "coupon-"+i,
    "true"
  );


  /* Change card */

  document
    .getElementById("coupon-"+i)
    .classList
    .add("redeemed");


  /* Change button */

  const btn =
    document.querySelector(
      "#coupon-"+i+" .redeem"
    );


  btn.textContent =
    "Redeemed ❤️";


  btn.disabled=true;


  /* Fill modal */

  document.getElementById(
    "modalIcon"
  ).textContent =
    coupons[i].icon;


  document.getElementById(
    "modalTitle"
  ).textContent =
    coupons[i].title;


  document.getElementById(
    "modalText"
  ).textContent =
    coupons[i].text;


  /* Show modal */

  document
    .getElementById("modal")
    .classList
    .add("show");

}



/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  document
    .getElementById("modal")
    .classList
    .remove("show");

}



/* =========================
   CLOSE WHEN CLICKING
   OUTSIDE MODAL
========================= */

window.addEventListener(
  "click",
  e => {

    if(
      e.target.id === "modal"
    ){

      closeModal();

    }

  }
);



/* =========================
   RESTORE REDEEMED COUPONS
========================= */

coupons.forEach((_,i)=>{


  if(
    localStorage.getItem(
      "coupon-"+i
    ) === "true"
  ){


    const card =
      document.getElementById(
        "coupon-"+i
      );


    card.classList.add(
      "redeemed"
    );


    const btn =
      card.querySelector(
        ".redeem"
      );


    btn.textContent =
      "Redeemed ❤️";


    btn.disabled=true;

  }

});

</script>


</body>
</html>
